# Washing Machine Gorenje WPAM14A2T (WM22 B2 Plus)
# Spin speed uses the base select: writes were confirmed on this variant in #661.
# Program mode stays a read-only sensor with the option labels observed by the
# original contributor in PR #268, as writes are untested and the labels differ
# from the base.
properties:
  - property: Selected_program_mode_status
    icon: 'mdi:tshirt-crew'
    sensor:
      read_only: true
      device_class: enum
      options:
        0: not_available
        1: normal
        3: fast
        4: extra_fast
