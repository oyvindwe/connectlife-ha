      unit: °C
      state_class: measurement
  - property: Position_of_tower
    hide: true
  - property: SL1_Active_timer
    optional: true
    sensor:
      device_class: enum
      options:
        0: inactive
        1: stopwatch
        2: timer
  - property: SL1_Bridge_function_active
    optional: true
    binary_sensor:
      options:
        0: off
        1: on
  - property: SL1_Cooking_method
    optional: true
    sensor:
      device_class: enum
      options:
        0: none
        1: method_1
        2: method_2
  - property: SL1_Pot_detected
    optional: true
    binary_sensor:
      options:
        0: off
        1: on
  - property: SL1_Power_level
    # Zones the hob doesn't have report 255.
    unavailable: 255
    sensor:
      device_class: enum
      options:
        0: "off"
        1: "1"
        2: "2"
        3: "3"
        4: "4"
