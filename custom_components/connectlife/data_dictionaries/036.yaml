# Induction hob. Same platform as 010; shared properties are mapped the same way.
properties:
  - property: BuiltIn_Hood_status
    hide: true
  - property: Circulation_mode
    hide: true
  - property: Demo_mode
    binary_sensor:
      options:
        0: off
        1: on
  - property: Device_status
    hide: true
    sensor:
      device_class: enum
      options:
        0: idle
        1: service
        2: production
        3: demo_mode
        4: iq
        5: running
        6: failure
        7: stand_by
        8: pause_mode
        9: locked
  - property: Global_timer_remaining_time_in_minutes
    sensor:
      read_only: true
      device_class: duration
      unit: min
  - property: HardPairingStatus
    entity_category: diagnostic
    binary_sensor:
      options:
        0: off
        1: on
  - property: Hood_connected_via_RF
    optional: true
    entity_category: diagnostic
  - property: Hood_total_used_hours
    hide: true
    entity_category: diagnostic
    sensor:
      device_class: duration
      unit: h
      state_class: total_increasing
  - property: IGBTTemperatureG01
    optional: true
    entity_category: diagnostic
    unavailable: 255
    sensor:
      read_only: true
      device_class: temperature
      unit: °C
      state_class: measurement
  - property: IGBTTemperatureG02
    optional: true
    entity_category: diagnostic
    unavailable: 255
    sensor:
      read_only: true
      device_class: temperature
      unit: °C
      state_class: measurement
