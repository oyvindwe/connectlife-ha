# Hisense WD5I1245BBR washer-dryer (025-1wj120596v0f)
properties:
- property: Selected_program_ID
  select:
    options:
      1: cotton_dry
      2: synthetic_dry
      4: refresh
      6: drum_clean
      7: cotton
      8: synthetic
      9: eco_40_60
      10: wool
      11: quick_15
      14: spin
      15: allergy_care
      16: baby_care
      20: rinse_spin
      22: wash_and_dry_49
      42: auto
      44: bedding
      52: power_30
      56: pets
      57: full_load_49
- property: Current_program_phase
  sensor:
    device_class: enum
    options:
      0: not_available
      1: weigh
      2: prewash
      3: wash
      4: rinsing
      6: anti_crease
      7: spinning
      8: drying
      10: finished
      11: delay_start_waiting
- property: ApplicationPermissions
  # Observed on this machine: 2 with remote control off, 3 with it on.
  optional: false
  sensor:
    device_class: enum
    options:
      2: disabled
      3: enabled
    read_only: true
- property: washing_program_kg
  # Max load of the selected program in 0.1 kg: 20 quick_15, 40 bedding, 60 synthetic_dry, 120 full_load_49.
  sensor:
    multiplier: 0.1
- property: washing_machine_type_max_speed
  # 14 = 1400 rpm, same encoding as the Spin_speed_rpm select.
  sensor:
    multiplier: 100
- property: DefaultSpinSpeed
  # The program's starting spin: 3 quick_15 (800), 4 bedding (1000), 5 full_load_49 (1200), 6 eco_40_60 (1400), 0 drying.
  sensor:
    device_class: enum
    unit: null
    options:
      0: none
      3: "800"
      4: "1000"
      5: "1200"
      6: "1400"
- property: mainwashtime
  # Same value as mian_wash_time.
  hide: true
- property: Temperature_Default_DefaultMainWashTime
  # Same value as mian_wash_time.
  hide: true
- property: Selected_program_total_running_time_in_minutes
  # Same value as Selected_program_total_time_in_minutes.
  hide: true
- property: washing_machine_type_kg
  # Always 0 on this machine.
  hide: true
