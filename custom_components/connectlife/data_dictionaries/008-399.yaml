# Ultraslim AC
climate:
  presets:
    - preset: eco
      t_power: 1
      t_work_mode: 5

properties:
  - property: t_fan_speed
    climate:
      options:
        0: auto
        5: low
        7: medium
        9: high
  - property: f_votage
    # Reports twice the voltage: ~244 on a 120 V circuit (#313).
    sensor:
      multiplier: 0.5
