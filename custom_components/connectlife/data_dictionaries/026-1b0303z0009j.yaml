# Hisense BC-303WP2BWQ1 refrigerator.
# ConnectLife returns no energy statistics for this model (#667).
statistics:
  source: energy_consumption_curve
  daily_energy_kwh: false
properties:
  # Range reported by refrigerator_min_temperature / refrigerator_max_temperature
  - property: refrigerator_temperature
    number:
      min_value: 2
      max_value: 8

  # Expose the supported modes as regular controls, not configuration entries.
  # Keep the inherited SET_SR_MODE and SET_SAVE_MODE command mappings.
  - property: sr_mode
    entity_category: null
    translation_key: hisense_super_cool
  - property: save_mode
    entity_category: null
    translation_key: hisense_eco

  # This model is a refrigerator-only appliance: suppress inherited freezer controls,
  # measurements, capability limits and the unsupported Super Freeze mode.
  - property: freeze_temperature
    disable: true
  - property: freeze_real_temperature
    disable: true
  - property: freeze_sensor_real_temperature
    disable: true
  - property: freeze_min_temperature
    disable: true
  - property: freeze_max_temperature
    disable: true
  - property: sf_mode
    disable: true
  - property: existing_sf_mode
    disable: true
  - property: frize_temp_2_degree_above_starting_point
    disable: true
