# Washing machine, feature code 1wj0803f2v0w.
# The model name is WF5I8043BWF but Home Assistant shows the cloud's device_feature_name "WF5i8014-FVW001" as the model instead.
# Program names from the model's user manual.
# The base 025.yaml already covers every property this machine exposes, so this override only names the program phases and turns Selected_program_ID into a select.
properties:
  - property: Current_program_phase
    # All phases verified on the device. No drying: washer only.
    sensor:
      device_class: enum
      options:
        0: not_available
        1: weigh
        2: prewash
        3: wash
        4: rinsing
        7: spinning
        10: finished
        11: delay_start_waiting
  - property: Selected_program_ID
    select:
      options:
        4: refresh
        6: drum_clean
        7: cotton
        8: synthetic
        9: eco_40_60
        10: wool
        11: quick_15
        14: spin
        15: allergy_care
        16: baby_care
        18: sportswear
        19: down
        20: rinse_spin
        42: auto
        44: bedding
        52: power_39
        56: pets
        57: full_load_59
