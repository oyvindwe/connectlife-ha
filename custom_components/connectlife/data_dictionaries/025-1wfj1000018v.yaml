# Hisense Series 8i 10 kg front load washer — HWF8I1015BX / HWF8I1015B (AU/NZ)
# Feature code 025-1wfj1000018v. Internal model string reported by the API:
# WF5i1015-QVB002-000.
#
# Selected_program_ID: all 17 programmes taken from the HWF8I1015BX user manual
#   (Baby Care, Synthetics, Quick 15', Cotton, Allergy Care, Auto, Refresh, Pets,
#   Power 30', Full load 49', Bedding, Wool, Sportswear, Down, Rinse+Spin,
#   Drum Clean, Spin). IDs 7 (cotton) and 19 (down) confirmed against the
#   machine's own panel; the rest follow the manual's programme order.
#
# Current_program_phase: 0, 1, 2, 3, 4, 7 and 10 have all been observed directly
#   on this machine, over several complete cycles:
#     - 30 °C cycle, no prewash:  0 -> 1 -> 3 -> 4 -> 7 -> 10 -> 0
#     - cold Cotton with prewash: 0 -> 1 -> 2 (prewash appears between weigh
#       and wash, and adds ~20 min to the reported programme total)
#   Phase 1 is brief — around 60 s — so it is easy to miss between polls.
#
#   5 (preheat_finished) and 11 (delay_start_waiting) are carried over from
#   sibling dictionaries and are NOT yet observed on this model. Worth noting
#   for 5: a 30 °C wash drew ~1.9 kW at the heater for the first ~8 minutes of
#   phase 3 and never reported phase 5 at any point, so on this model heating
#   appears to happen wholly inside phase 3. If a hotter wash also fails to
#   emit 5, it should probably be dropped for this feature code.
properties:
  - property: Current_program_phase
    sensor:
      read_only: true
      device_class: enum
      options:
        0: not_available
        1: weigh
        2: prewash
        3: wash
        4: rinsing
        5: preheat_finished # not observed
        7: spinning
        10: finished
        11: delay_start_waiting # not observed

  - property: Selected_program_ID
    sensor:
      read_only: true
      device_class: enum
      options:
        4: refresh
        6: drum_clean
        7: cotton
        8: synthetic
        10: wool
        11: quick_15
        14: spin
        15: allergy_care
        16: baby_care
        18: sportswear
        19: down
        20: rinse_spin
        42: auto
        44: bedding
        52: power_30
        56: pets
        57: full_load_49
