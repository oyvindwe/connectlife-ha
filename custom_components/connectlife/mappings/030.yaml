# Tumble dryer
device_type_name: Tumble dryer
statistics:
  source: energy_consumption_curve
  daily_energy_kwh: true
# Actions 1 stop, 2 start/resume, 3 pause, verified on the DH3S802BW3 (030-1wk080066v0w, #758). machine_status:
# 1 standby, 2 running, 3 paused. ApplicationPermissions: 2 allows everything except starting, 3 also allows starting
# (remote start enabled on the dryer). Stop with 2 seen on the DHSE10-BVW113 (030-1wk100266v0f, #538).
buttons:
  - key: start
    icon: mdi:play
    available_when:
      ApplicationPermissions: 3
      machine_status: [1, 3]
    write:
      Actions: 2
  - key: pause
    icon: mdi:pause
    available_when:
      ApplicationPermissions: [2, 3]
      machine_status: 2
    write:
      Actions: 3
  - key: stop
    icon: mdi:stop
    available_when:
      ApplicationPermissions: [2, 3]
      machine_status: [2, 3]
    write:
      Actions: 1
properties:
  - property: Actions
    # Replaced by the start, pause and stop buttons; always reads 0.
    disable: true
  - property: AntiCrease
    icon: mdi:iron
    switch:
  - property: ApplicationPermissions
    # Sample value: 2
    optional: true
  - property: Aromatherapy
    # Sample value: 0
    optional: true
  - property: Auxiliary_heat
    # Sample value: 0
    optional: true
  - property: Child_lock
    icon: mdi:lock
    entity_category: config
    switch:
  - property: Clean_Filter
    icon: mdi:brush-variant
    # The ConnectLife self-check table lists Clean_Filter = 1 as the "filter status" fault.
    binary_sensor:
      device_class: problem
      options:
        0: off
        1: on
        2: on
  - property: Current_program_phase
    icon: mdi:tumble-dryer
    sensor:
      device_class: enum
      options:
        0: idle
        1: delay_start_waiting
        2: running
        3: running
        4: anti_crease
        5: finished
      read_only: true
    # Sample value: 0
  - property: DelayEndTime_Hour
    icon: mdi:clock-end
    number:
      min_value: 0
      max_value: 24
  - property: DelayEndTime_Minute
    # Sample value: 0
    optional: true
  - property: Door_status
    # 1 when the door is open, 2 when closed (#758, #821)
    unavailable: 0
    binary_sensor:
      device_class: door
      options:
        1: on
        2: off
    icon: mdi:door
  - property: DownLight_LightTime
    # Sample value: 0
    optional: true
  - property: Drum_Light
    icon: mdi:lightbulb
    entity_category: config
    switch:
  - property: Dry_Level
