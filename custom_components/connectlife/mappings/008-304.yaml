climate:
  presets:
    - preset: bedtime
      t_power: 1
      t_work_mode: 2
      t_fan_speed: 3
      t_temp: 64
    - preset: eco
      t_power: 1
      t_work_mode: 5
properties:
  # Fan speeds in this feature code's ConnectLife property list (no auto), as on 008-301.
  - property: t_fan_speed
    climate:
      options:
        2: low
        3: medium
        4: high
