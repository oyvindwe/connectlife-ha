# Hisense BCD-280WP2BWQ1/HC4(HAA) refrigerator-freezer (#879).
# ConnectLife returns no energy statistics for this model (all days 0, and none in the app).
statistics:
  source: energy_consumption_curve
  daily_energy_kwh: false
properties:
  # Range reported by refrigerator_min_temperature / refrigerator_max_temperature
  - property: refrigerator_temperature
    number:
      min_value: 2
      max_value: 8

  # No variable-temperature compartment: its temperatures report the -40 placeholder.
  - property: open_variation_door_alarm
    disable: true
  - property: vari_room_open
    disable: true
  - property: vari_temp_2_degree_above_starting_point
    disable: true
  - property: variation_door_open_time
    disable: true
  - property: variation_max_temperature
    disable: true
  - property: variation_min_temperature
    disable: true
  - property: variation_real_temperature
    disable: true
  - property: variation_sensor_real_temperature
    disable: true
  - property: variation_temperature
    disable: true

  # No ice maker (confirmed by the owner).
  - property: automatic_ice_making
    disable: true
  - property: ice_machine_actual_temp
    disable: true
  - property: ice_make_room_alarm
    disable: true
  - property: ice_make_room_switch
    disable: true
  - property: ice_maker_wash_state
    disable: true
  - property: ice_making_b_switch_status
    disable: true
  - property: ice_making_fast_status
    disable: true
  - property: ice_making_full_status
    disable: true
  - property: ice_making_machine_failure
    disable: true
  - property: ice_making_normal_status
    disable: true
  - property: ice_making_state
    disable: true
  - property: ice_making_stop_status
    disable: true
  - property: ice_room_actual_temp
    disable: true
  - property: ice_sensor_failure_flag
    disable: true
  - property: ice_temperature_sensor_header_failure_flag
    disable: true
  - property: second_ice_maker_full_status
    disable: true
  - property: second_ice_maker_init_fault
    disable: true
  - property: second_ice_maker_sensor_fault
    disable: true

  # No holiday mode (confirmed by the owner).
  - property: existing_holiday_mode
    disable: true
  - property: holiday_mode
    disable: true

  # The fruit and vegetable drawer has no temperature control of its own (confirmed by the owner).
  - property: fruit_vegetables_temperature
    disable: true
