# ASKO dishwasher (DFI777UXXL family).
#
# Programs and allowed modes as reported in system data (#624).
buttons:
  - key: stop
    icon: mdi:stop
    write:
      Actions: 1
  - key: start
    icon: mdi:play
    available_when:
      Remote_control_monitoring_set_commands_actions: 2
    write:
      Actions: 2
  - key: open_door
    icon: mdi:door-open
    available_when:
      MDO_on_demand_allowed: 2
    write:
      MDO_on_demand: 1
properties:
  - property: Selected_program_id_status
    select:
      options:
        0: eco
        1: auto
        2: universal
        3: intensive
        4: quick_pro
        5: preheated
        6: crystal_glass
        7: time_program
        8: hygiene
        9: plastic
        10: rinse_and_hold
        11: self_cleaning
        12: lower_half
        13: upper_half
        14: odor_control
      command:
        name: Selected_program_id
  - property: Selected_program_mode
    select:
      options:
        0: "not_available"
        2: "normal"
        3: "green"
        4: "speed"
        5: "night"
        6: "intensive"
        7: "uv"
      command:
        name: Program_mode
        adjust: 1
  - property: Time_program_set_duration_status
    select:
      options:
        0: "not_available"
        1: "not_set"
        2: "15_min"
        3: "30_min"
        4: "45_min"
        5: "1_h"
        6: "1_h_30_min"
        7: "2_h"
        8: "2_h_30_min"
      command:
        name: Time_program_set_duration
        adjust: 1
  - property: MDO_on_demand
    hide: true
  - property: MDO_on_demand_allowed
    hide: true
