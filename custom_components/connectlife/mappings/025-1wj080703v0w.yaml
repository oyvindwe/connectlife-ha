statistics:
  source: energy_consumption_curve
  daily_energy_kwh: true
  daily_water_consumption: true
properties:
  - property: Electricit_consumption
    icon: mdi:lightning-bolt
    sensor:
      device_class: energy
      unit: kWh
      read_only: true
      state_class: total_increasing
    combine:
      - property: Electricit_consumption_int
      - property: Electricit_consumption_decimal
        multiplier: 0.01
  - property: Water_consumption
    icon: mdi:water
    sensor:
      device_class: water
      unit: L
      read_only: true
      state_class: total_increasing
    combine:
      - property: Water_consumption_int
      - property: Water_consumption_decimal
        multiplier: 0.01
  - property: temperature
    icon: mdi:thermometer-lines
    sensor:
      read_only: true
      device_class: enum
      options:
        0: "cold"
        2: "20"
        3: "30"
        4: "40"
        6: "60"
        9: "90"
  - property: Selected_program_ID
    icon: mdi:tshirt-crew
    sensor:
      read_only: true
      device_class: enum
