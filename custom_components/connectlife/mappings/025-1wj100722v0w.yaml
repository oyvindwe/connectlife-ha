# Washing machine WF3S1043BW3
properties:
- property: Current_program_phase
  # Phases as in this feature code's ConnectLife property list.
  sensor:
    device_class: enum
    options:
      0: not_available
      1: weigh
      2: prewash
      3: wash
      4: rinsing
      5: softening
      6: anti_crease
      7: spinning
      8: drying
      9: ventilating
      10: finished
      11: delay
- property: Selected_program_ID
  sensor:
    read_only: true
    device_class: enum
    options:
      0: cotton_storage
      1: standard
      2: iron
      3: mix
      4: synthetic
      5: wool
      6: bedding
      7: time
      8: baby_care
      9: sensitive
      10: shirts
      11: sportswear
      12: fast89
      13: extra_hygiene
      14: remote
      15: none
