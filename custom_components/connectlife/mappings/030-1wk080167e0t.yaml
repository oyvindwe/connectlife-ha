# Hisense DH3S80-DEW012-000 tumble dryer (030-1wk080167e0t).
# The generic 030.yaml maps both 2 and 3 to the vague "running". 2 is drying: confirmed live
# (2026-10-30) on this machine. 3 is left as "running" because it has not been observed yet.
properties:
  - property: Current_program_phase
    icon: mdi:tumble-dryer
    sensor:
      device_class: enum
      options:
        0: idle
        1: delay_start_waiting
        2: drying
        3: running
        4: anti_crease
        5: finished
      read_only: true
  - property: Clean_Filter
    # ConnectLife's self-check table for this dryer (diagnostics) lists Clean_Filter = 1
    # as the "filter status" fault. The binary-sensor default reads 1 as off, so the
    # alert could never show.
    binary_sensor:
      device_class: problem
      options:
        0: off
        1: on
        2: on
  - property: Waterbox_Full
    # The same table lists Waterbox_Full = 1 as the "water container" fault.
    binary_sensor:
      options:
        0: off
        1: on
        2: on
  - property: energy
    # Follows the selected program, not the energy used (as on 030-1wk080066v0w).
    hide: true
  - property: Selected_program_total_running_time_in_minutes
    # Same value as Selected_program_total_time_in_minutes.
    hide: true
