# Washing Machine Hisense WFSE1214-MVW002 (025-1wfj1200077v)
#
# The cloud reports feature code 1wfj1200077v. Without a feature mapping, base
# 025.yaml left Selected_program_ID and Current_program_phase as raw numbers.
#
# Both are mapped as read-only enum sensors (display only). Writing
# Selected_program_ID has not been tested on this variant.
#
# Program codes follow the 12 kg sibling mapping 025-1wj120238v0b (WF5S1245BB).
# Confirmed on this machine: 42 auto; phases 3 wash, 4 rinsing, 7 spinning.
# Phases 5, 6 and 11 are taken from the device property list in diagnostics.
properties:
  - property: Selected_program_ID
    sensor:
      read_only: true
      device_class: enum
      options:
        6: drum_clean
        7: cotton
        9: eco_40_60
        10: wool
        11: quick_15
        12: mix
        14: spin
        15: allergy_care
        16: baby_care
        18: sportswear
        19: down
        20: rinse_spin
        21: silk_delicate
        24: shirts
        41: power_49
        42: auto
        44: bedding
        45: jeans

  - property: Current_program_phase
    sensor:
      read_only: true
      device_class: enum
      options:
        0: not_available
        1: weigh
        2: prewash
        3: wash
        4: rinsing
        5: softening
        6: anti_crease
        7: spinning
        10: finished
        11: delay
