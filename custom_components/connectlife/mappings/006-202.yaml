# Portable air conditioner — cool-only (no heat mode)
properties:
  # Fan speeds in this feature code's ConnectLife property list (no quiet).
  - property: t_fan_speed
    climate:
      options:
        0: auto
        2: low
        3: medium
        4: high
  - property: t_work_mode
    climate:
      options:
        0: fan_only
        2: cool
        3: dry
        4: auto
