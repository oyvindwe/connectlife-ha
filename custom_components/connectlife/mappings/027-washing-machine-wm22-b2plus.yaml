# Washing Machine Gorenje WPAM14A2T (WM22 B2 Plus)
# Spin speed uses the base select: writes were confirmed on this variant in #661.
# Program mode stays a read-only sensor with the option labels observed by the
# original contributor in PR #268, as writes are untested and the labels differ
# from the base.
buttons:
# The machine only uses the program options when they are sent with the start
# command (#661). Programs without a temperature or spin option report 0, which
# is skipped.
- key: start
  include:
    - Selected_program_id_status
    - Selected_program_set_temperature_status
    - Selected_program_washing_spin_speed_rpm_status
properties:
  - property: Selected_program_mode_status
    icon: 'mdi:tshirt-crew'
    sensor:
      read_only: true
      device_class: enum
      options:
        0: not_available
        1: normal
        3: fast
        4: extra_fast
