buttons:
# t_dimmer is write-only on this model (not reported in statusList), so it is
# exposed as two buttons rather than a switch. 1 = LED on, 0 = LED off, same as
# 009-104 (#644).
- key: light_on
  icon: mdi:lightbulb-on
  write:
    t_dimmer: 1
- key: light_off
  icon: mdi:lightbulb-off
  write:
    t_dimmer: 0
climate:
  presets:
    - t_eco: 1
      t_fan_speed: 0 # auto
      t_power: 1
      preset: eco
    - t_fan_mute: 1
      t_fan_speed: 0 # auto
      t_power: 1
      preset: mute
