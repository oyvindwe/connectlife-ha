# Window air conditioner — heat-supporting
properties:
  # Fan speeds in this feature code's ConnectLife property list (no auto), as on 008-301.
  - property: t_fan_speed
    climate:
      options:
        2: low
        3: medium
        4: high
  - property: t_work_mode
    climate:
      options:
        0: fan_only
        1: heat
        2: cool
        3: dry
        5: eco
